<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#345d4d"><meta name="description" content="乐乐的日语备考词库：词表、读音字形训练、短语联想、间隔复习。"><title>拾词 · 日语备考自习室</title><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css?v=5"><script defer src="./data.js?v=3"></script><script defer src="./engine.js?v=3"></script><script defer src="./quiz.js?v=3"></script><script defer src="./app.js?v=5"></script></head>
<body>
<div class="app-shell">
<aside class="sidebar"><a class="brand" href="#today" aria-label="拾词首页"><span class="brand-icon">拾</span><span>拾词</span></a><nav aria-label="主导航">
<button data-view="today" class="nav-item active"><span>◈</span>今日学习</button>
<button data-view="review" class="nav-item"><span>↻</span>间隔复习 <b id="dueNav">0</b></button>
<button data-view="library" class="nav-item"><span>▤</span>全部词库</button>
<button data-view="mistakes" class="nav-item"><span>☆</span>易错与收藏</button>
<button data-view="stats" class="nav-item"><span>▥</span>学习记录</button>
</nav><div class="sidebar-bottom"><button data-view="about" class="nav-item"><span>ⓘ</span>词库与筛选依据</button><button id="settingsButton" class="nav-item"><span>⚙</span>计划与备份</button><div class="sidebar-tools"><span class="storage-status" id="saveStatus">● 本机保存</span><button class="icon-button" id="helpButton" aria-label="键盘快捷键">⌘</button></div><div class="profile"><span class="avatar">乐</span><div><strong>语言考试</strong><small>日语学习计划</small></div></div></div></aside>
<div class="workspace"><main id="main" tabindex="-1"></main><footer>拾词<span>进度保存在当前浏览器，可在「计划与备份」导出。</span></footer></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="settingsDialog"><form method="dialog" class="dialog-head"><h2>学习计划与备份</h2><button class="icon-button" aria-label="关闭">✕</button></form><div class="dialog-body"><p class="muted">默认每天20个新词、50个复习词。复习量不足时只安排实际到期的词。</p><div class="form-grid"><label>每日新词<input id="newGoal" type="number" min="1" max="100" value="20"></label><label>每日复习上限<input id="reviewGoal" type="number" min="1" max="200" value="50"></label></div><button id="saveSettings" class="button primary full">保存学习计划</button><hr><h3>进度备份</h3><p class="muted small">进度保存在本机，不会在手机和电脑间自动同步。换浏览器或清除数据前，请导出备份。</p><div class="button-row"><button id="exportButton" class="button secondary">↓ 导出进度</button><label class="button secondary file-label">↑ 导入进度<input id="importFile" type="file" accept="application/json,.json" hidden></label></div><p id="backupInfo" class="muted small"></p><button id="downloadWords" class="text-button">下载词表（含来源与短语）</button></div></dialog>
<dialog id="importDialog"><div class="dialog-body"><h2>替换本机学习进度？</h2><p id="importSummary"></p><p class="muted">将用这个备份替换当前浏览器的进度。网站会先下载一份当前进度，方便恢复。</p><div class="button-row"><button id="cancelImport" class="button secondary">取消</button><button id="confirmImport" class="button primary">导入并替换</button></div></div></dialog>
<dialog id="detailDialog"><form method="dialog" class="dialog-head"><h2>单词详情</h2><button class="icon-button" aria-label="关闭">✕</button></form><div id="detailContent" class="dialog-body"></div></dialog>
<noscript>请启用 JavaScript 以使用单词卡和本地学习进度。</noscript></body></html>
